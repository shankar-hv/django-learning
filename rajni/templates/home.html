<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>
</head>
<body>
    <center>
        {% for student in students %}
            <p>Name : {{student.name}}</p>
            <p>Roll : {{student.roll}}</p>
            <p>Marks : {{student.marks}}</p>
            <hr>
        {%endfor%}
    </center>
</body>
</html>
